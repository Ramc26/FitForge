<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitForge | Multi-Protocol</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a" id="themeColorMeta">
    <link rel="apple-touch-icon" href="forge-icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FitForge">
    <meta name="description" content="FitForge: Daily workout tracker and fitness protocol.">
    <link rel="icon" type="image/svg+xml" href="forge-icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="forge-icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="forge-icon-512.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Poppins:wght@300;400;600;700;800&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* =========================================
           1. SHARED CORE VARIABLES & LAYOUT
           ========================================= */
        :root {
            /* Default: Flat Dark Theme */
            --bg-color: #0a0a0a;
            --card-bg: #161616;
            --header-bg: rgba(10, 10, 10, 0.85);
            --accent-main: #00ff88;
            --accent-secondary: #eab308;
            --text-main: #ffffff;
            --text-muted: #eab308;
            --border-color: #222;

            --radius-card: 16px;
            --radius-btn: 8px;
            --radius-bubble: 50%;

            --border-card: 1px solid var(--border-color);
            --border-bubble: 2px solid #333;

            --shadow-card: none;
            --shadow-bubble: none;
            --shadow-btn: none;

            --font-primary: 'Poppins', sans-serif;
            --font-header: 'Syncopate', sans-serif;
            --font-secondary: 'Poppins', sans-serif;
            /* Changes to mono in brutalism */
        }

        .text-muted {
            color: var(--text-muted) !important;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-primary);
            padding-bottom: 32px;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s, color 0.3s;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        .brand-font {
            font-family: var(--font-header);
            text-transform: uppercase;
            font-weight: 700;
        }

        /* Generic Layout Classes */
        .dashboard-header {
            padding: 12px 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            grid-template-rows: auto auto;
            align-items: center;
            column-gap: 10px;
            row-gap: 0;
            margin-bottom: 25px;
            background: var(--header-bg);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            border-bottom: var(--border-card);
        }

        .brand-lockup {
            grid-column: 1;
            grid-row: 1;
            display: flex;
            align-items: center;
            gap: 11px;
            min-width: 0;
            max-width: 100%;
            text-decoration: none;
            color: inherit;
        }

        .brand-mark-wrap {
            position: relative;
            flex-shrink: 0;
        }

        .brand-mark {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: var(--border-card);
            background: var(--card-bg);
            box-shadow: var(--shadow-btn), 0 0 24px rgba(0, 255, 136, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-mark-fire {
            background: linear-gradient(180deg, rgba(20, 20, 20, 0.9) 0%, rgba(40, 18, 8, 0.35) 100%);
        }

        .brand-emoji {
            font-size: 1.65rem;
            line-height: 1;
            display: block;
            user-select: none;
        }

        .brand-mark-wrap::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 14px;
            border: 1px solid rgba(0, 255, 136, 0.35);
            pointer-events: none;
            opacity: 0.6;
        }

        .brand-text {
            min-width: 0;
            line-height: 1.05;
            overflow: hidden;
        }

        .brand-title {
            font-family: var(--font-header);
            font-size: 1.15rem;
            letter-spacing: 0.1em;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-tagline {
            display: block;
            font-size: 0.58rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--accent-main);
            margin-top: 3px;
            opacity: 0.95;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-menu-btn {
            grid-column: 2;
            grid-row: 1;
            display: none;
            justify-self: end;
        }

        .header-toolbar {
            grid-column: 2;
            grid-row: 1;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: nowrap;
            max-width: 100%;
        }

        .header-toolbar-section {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
        }

        .header-toolbar-label {
            font-size: 0.62rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .header-drawer-inner {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-drawer-block {
            display: contents;
        }

        .header-drawer-heading {
            display: none;
        }

        .device-toggle-group label .device-name {
            display: none;
        }

        .header-action-label {
            display: none;
        }

        @media (max-width: 620px) {
            .header-menu-btn {
                display: flex;
            }

            .dashboard-header.menu-open {
                padding-bottom: 14px;
            }

            .header-toolbar {
                display: none;
                grid-column: 1 / -1;
                grid-row: 2;
                flex-direction: column;
                align-items: stretch;
                margin-top: 12px;
                padding: 0;
                border: none;
            }

            .dashboard-header.menu-open .header-toolbar {
                display: flex;
                animation: headerPanelIn 0.28s cubic-bezier(0.34, 1.2, 0.64, 1);
            }

            .header-drawer-inner {
                display: flex;
                flex-direction: column;
                gap: 14px;
                width: 100%;
                padding: 16px;
                border-radius: var(--radius-card);
                border: var(--border-card);
                background: var(--card-bg);
                box-shadow: var(--shadow-card);
            }

            .header-drawer-block {
                display: block;
            }

            .header-drawer-heading {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 0.62rem;
                font-weight: 800;
                letter-spacing: 0.16em;
                text-transform: uppercase;
                color: var(--text-muted);
                margin: 0 0 10px;
            }

            .header-drawer-heading i {
                color: var(--accent-main);
            }

            .header-drawer-spotify .device-toggle-group {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                width: 100%;
                border-radius: var(--radius-btn);
            }

            .header-drawer-spotify .device-toggle-group label {
                flex-direction: column;
                gap: 5px;
                padding: 10px 6px;
                min-width: 0;
                border-right: var(--border-card);
                font-size: 0.7rem;
            }

            .header-drawer-spotify .device-toggle-group label:last-child {
                border-right: none;
            }

            .device-toggle-group label .device-name {
                display: block;
                font-size: 0.58rem;
                font-weight: 800;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            .header-action-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
                width: 100%;
            }

            .header-action-grid .btn-action,
            .header-action-grid .dropdown .btn-action {
                width: 100%;
                min-height: 56px;
                flex-direction: column;
                gap: 6px;
                padding: 10px 6px;
                font-size: 0.85rem;
            }

            .header-action-grid .dropdown {
                width: 100%;
            }

            .header-action-label {
                display: block;
                font-size: 0.55rem;
                font-weight: 800;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                line-height: 1.1;
                opacity: 0.85;
            }

            .header-toolbar-section {
                width: 100%;
            }

            .header-tool-row {
                width: 100%;
            }
        }

        @media (min-width: 621px) {
            .header-action-grid {
                display: flex;
                align-items: center;
                gap: 8px;
            }
        }

        @media (min-width: 621px) and (max-width: 700px) {
            .header-toolbar {
                gap: 6px;
            }

            .header-toolbar-label {
                display: none !important;
            }

            .btn-action {
                padding: 6px 9px;
            }
        }

        @keyframes headerPanelIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 380px) {
            .brand-title {
                font-size: 1.02rem;
                letter-spacing: 0.08em;
            }

            .brand-mark {
                width: 38px;
                height: 38px;
            }

            .brand-emoji {
                font-size: 1.45rem;
            }

            .brand-tagline {
                letter-spacing: 0.16em;
                font-size: 0.52rem;
            }
        }

        @keyframes waveFlow {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .btn-action {
            background: var(--card-bg);
            color: var(--text-main);
            border: var(--border-card);
            border-radius: var(--radius-btn);
            font-size: 0.9rem;
            padding: 6px 12px;
            box-shadow: var(--shadow-btn);
            transition: all 0.2s;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .workout-card {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            border: var(--border-card);
            box-shadow: var(--shadow-card);
            margin-bottom: 15px;
            padding: 20px;
            transition: all 0.3s;
        }

        .ex-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .ex-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
            display: flex;
            align-items: center;
        }

        .set-container {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .set-bubble {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-bubble);
            border: var(--border-bubble);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            background: var(--card-bg);
            color: var(--text-muted);
            box-shadow: var(--shadow-bubble);
            transition: all 0.2s;
            font-family: var(--font-secondary);
        }

        .finisher-label {
            display: flex;
            align-items: center;
            width: 100%;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .finisher-checkbox {
            width: 1.8em;
            height: 1.8em;
            background: var(--card-bg);
            border: var(--border-bubble);
            border-radius: var(--radius-btn);
            margin-right: 15px;
            appearance: none;
            cursor: pointer;
            box-shadow: var(--shadow-bubble);
            transition: all 0.2s;
        }

        .finisher-checkbox:checked {
            position: relative;
        }

        .finisher-checkbox:checked::after {
            content: '✓';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .anatomy-toggle {
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 15px;
            display: inline-flex;
            align-items: center;
            font-weight: 700;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .anatomy-content {
            display: none;
            font-size: 0.85rem;
            margin-top: 10px;
            padding: 12px;
            line-height: 1.6;
        }

        .machine-alt {
            font-size: 0.85rem;
            margin-top: 15px;
            display: block;
            font-weight: 700;
            text-transform: uppercase;
        }

        .progress-wrapper {
            margin-bottom: 30px;
        }

        .progress {
            height: 12px;
            border-radius: var(--radius-btn);
            overflow: visible;
            transition: all 0.3s;
        }

        .progress-bar {
            border-radius: var(--radius-btn);
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .media-card {
            border-radius: var(--radius-card);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            width: 100%;
            border: var(--border-card);
            box-shadow: var(--shadow-card);
            transition: all 0.2s;
            text-transform: uppercase;
        }

        #floatingTimer {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(200%);
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1.5rem;
            z-index: 999;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-family: var(--font-secondary);
        }

        #floatingTimer.show {
            transform: translateX(-50%) translateY(0);
        }

        .modal-content {
            background: var(--card-bg);
            color: var(--text-main);
            border: var(--border-card);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
        }

        .modal-header {
            border-bottom: var(--border-card);
        }

        .audio-list-item {
            display: flex;
            align-items: flex-start;
            text-decoration: none;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: var(--radius-btn);
            transition: all 0.2s;
            gap: 12px;
        }

        .audio-list-item .audio-item-body {
            flex: 1;
            min-width: 0;
        }

        .audio-list-item .audio-item-title {
            font-weight: 700;
            font-size: 0.95rem;
            line-height: 1.3;
        }

        .audio-list-item .audio-item-desc {
            font-size: 0.8rem;
            opacity: 0.75;
            margin-top: 4px;
            line-height: 1.45;
            font-weight: 400;
            text-transform: none;
        }

        .audio-category-label {
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin: 18px 0 10px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .audio-category-label:first-child {
            margin-top: 0;
        }

        .device-toggle-group {
            display: inline-flex;
            flex-shrink: 0;
            border-radius: var(--radius-btn);
            overflow: hidden;
            border: var(--border-card);
            box-shadow: var(--shadow-btn);
        }

        .device-toggle-group input {
            display: none;
        }

        .device-toggle-group label {
            margin: 0;
            padding: 6px 9px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            background: var(--card-bg);
            color: var(--text-muted);
            border-right: var(--border-card);
            transition: all 0.2s;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 32px;
        }

        .device-toggle-group label:last-child {
            border-right: none;
        }

        .device-toggle-group input:checked + label {
            background: var(--accent-main);
            color: #000;
        }

        [data-theme=""] .device-toggle-group input:checked + label,
        body:not([data-theme]) .device-toggle-group input:checked + label {
            color: #000;
        }

        [data-theme="minimal"] .device-toggle-group input:checked + label,
        [data-theme="brutal"] .device-toggle-group input:checked + label {
            color: #000;
        }

        .plan-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 6px 12px;
            border-radius: 20px;
            border: var(--border-card);
            background: var(--card-bg);
            color: var(--accent-main);
            cursor: pointer;
            transition: all 0.2s;
        }

        .plan-badge:hover {
            border-color: var(--accent-main);
        }

        .day-picker-wrap {
            margin-bottom: 12px;
        }

        .day-picker {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 2px 2px 6px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .day-picker::-webkit-scrollbar {
            display: none;
        }

        .day-chip {
            flex-shrink: 0;
            border: var(--border-card);
            background: var(--card-bg);
            color: var(--text-muted);
            border-radius: 20px;
            padding: 7px 11px;
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1;
        }

        .day-chip.is-calendar-today {
            box-shadow: inset 0 0 0 1px var(--accent-main);
        }

        .day-chip.is-selected {
            background: var(--accent-main);
            border-color: var(--accent-main);
            color: #000;
        }

        .day-chip.is-selected.is-calendar-today {
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.35);
        }

        .day-view-hint {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        .catchup-banner {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent-secondary);
            margin-bottom: 12px;
        }

        footer {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 28px 12px 36px;
            text-align: center;
            font-size: 0.78rem;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.35s ease, transform 0.35s ease;
            pointer-events: none;
            color: var(--text-muted);
        }

        footer.is-visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .footer-avatar {
            width: 24px;
            height: 24px;
            vertical-align: middle;
            margin-right: 8px;
            border-radius: 50%;
        }

        /* Dropdown overrides */
        .dropdown-menu {
            border-radius: var(--radius-btn);
            box-shadow: var(--shadow-card);
            padding: 8px;
            min-width: 150px;
        }

        .dropdown-item {
            border-radius: 4px;
            padding: 8px 15px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        /* =========================================
           2. THEME: FLAT DARK (Default Overrides)
           ========================================= */
        .brand-title.brand-logo {
            background: linear-gradient(-45deg, #cb4154, #eab308, #ffffff, #00ff88);
            background-size: 300% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: waveFlow 8s ease infinite;
            filter: drop-shadow(0 0 12px rgba(0, 255, 136, 0.25));
        }

        .btn-action:hover,
        .btn-action.active,
        #voiceToggle.active {
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent-main);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .workout-card.completed-card {
            border-color: rgba(0, 255, 136, 0.3);
            background: rgba(0, 255, 136, 0.02);
        }

        .set-bubble.active {
            background: var(--accent-main);
            border-color: var(--accent-main);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
            transform: scale(1.1);
        }

        .finisher-checkbox:checked {
            background: var(--accent-main);
            border-color: var(--accent-main);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }

        .finisher-checkbox:checked::after {
            color: #000;
            font-weight: 900;
        }

        .anatomy-toggle {
            background: rgba(0, 255, 136, 0.1);
            color: var(--accent-main);
            padding: 6px 12px;
            border-radius: 6px;
        }

        .anatomy-content {
            background: #111;
            border-left: 3px solid var(--accent-main);
            border-radius: 0 8px 8px 0;
            color: #ccc;
        }

        .machine-alt {
            color: var(--accent-secondary);
        }

        .opt-badge {
            background: #333 !important;
            color: #fff !important;
        }

        .progress {
            background: #222;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        .progress-bar {
            background: var(--accent-main);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }

        .progress-wrapper.is-complete .progress-bar {
            background: var(--accent-secondary);
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.5);
        }

        .progress-wrapper.is-complete #progressText {

        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title brand-font fs-6" id="audioModalTitle"><i
                            class="fa-brands fa-spotify me-2"></i> SPOTIFY</h5><button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="audioModalList"></div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // --- 1. THEME INITIALIZATION & LOGIC ---
        const themeMeta = document.getElementById('themeColorMeta');
        let currentTheme = localStorage.getItem('fitforge_theme') || 'flat';

        function applyTheme(theme) {
            document.body.setAttribute('data-theme', theme === 'flat' ? '' : theme);
            currentTheme = theme;

            // Update Meta Tag for Mobile Browsers
            const metaColors = { 'flat': '#0a0a0a', 'clay': '#e0e5ec', 'brutal': '#f4f0ea', 'minimal': '#fcfcfc' };
            themeMeta.setAttribute('content', metaColors[theme]);

            // Update Dropdown Active State
            $('.theme-select').removeClass('active');
            $(`.theme-select[data-theme-val="${theme}"]`).addClass('active');

            localStorage.setItem('fitforge_theme', theme);
        }

        applyTheme(currentTheme);

        $('.theme-select').on('click', function (e) {
            e.preventDefault();
            applyTheme($(this).data('theme-val'));
        });

        // --- 2. CORE APP LOGIC ---
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(err => console.log('SW fail')); }); }

        const WORKOUT_PLANS = {
            schedule: { label: 'Classic Split' },
            schedule_2: { label: 'Enhanced Split' },
            schedule_3: { label: 'V-Tapper' }
        };

        const WEEK_DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const DAY_ABBR = { Sunday: 'Sun', Monday: 'Mon', Tuesday: 'Tue', Wednesday: 'Wed', Thursday: 'Thu', Friday: 'Fri', Saturday: 'Sat' };

        let appData = null;
        let currentAudioFilter = 'all';
        let totalTasks = 0;
        let timerInterval;
        let selectedViewDay = null;
        const todayDateStr = new Date().toDateString();
        let savedState = JSON.parse(localStorage.getItem('fitforge_state')) || {};
        let currentPlanKey = localStorage.getItem('fitforge_plan') || 'schedule';
        if (!WORKOUT_PLANS[currentPlanKey]) currentPlanKey = 'schedule';

        function emptyDayProgress() {
            return { checkedSets: {}, finisherDone: false, hasCelebrated: false };
        }

        function emptyPlanProgress() {
            const days = {};
            WEEK_DAYS.forEach(d => { days[d] = emptyDayProgress(); });
            return { days };
        }

        function normalizePlanProgress(plan, carryDayName) {
            if (plan && plan.days) return plan;
            const legacy = {
                checkedSets: (plan && plan.checkedSets) || {},
                finisherDone: !!(plan && plan.finisherDone),
                hasCelebrated: !!(plan && plan.hasCelebrated)
            };
            const normalized = emptyPlanProgress();
            if (carryDayName) normalized.days[carryDayName] = legacy;
            return normalized;
        }

        function migrateSavedState() {
            const voiceEnabled = savedState.voiceEnabled || false;
            const calendarToday = getTodayName();
            if (savedState.date !== todayDateStr) {
                savedState = {
                    date: todayDateStr,
                    voiceEnabled,
                    activePlan: currentPlanKey,
                    plans: {}
                };
                Object.keys(WORKOUT_PLANS).forEach(k => { savedState.plans[k] = emptyPlanProgress(); });
                localStorage.setItem('fitforge_state', JSON.stringify(savedState));
                return;
            }
            if (!savedState.plans) {
                const legacy = {
                    checkedSets: savedState.checkedSets || {},
                    finisherDone: !!savedState.finisherDone,
                    hasCelebrated: !!savedState.hasCelebrated
                };
                savedState = {
                    date: todayDateStr,
                    voiceEnabled,
                    activePlan: currentPlanKey,
                    plans: {}
                };
                Object.keys(WORKOUT_PLANS).forEach(k => {
                    const base = emptyPlanProgress();
                    if (k === currentPlanKey) base.days[calendarToday] = legacy;
                    savedState.plans[k] = base;
                });
                localStorage.setItem('fitforge_state', JSON.stringify(savedState));
            }
            savedState.activePlan = currentPlanKey;
            Object.keys(WORKOUT_PLANS).forEach(k => {
                if (!savedState.plans[k]) savedState.plans[k] = emptyPlanProgress();
                else savedState.plans[k] = normalizePlanProgress(savedState.plans[k], calendarToday);
            });
        }

        migrateSavedState();

        function getViewDayName() {
            return selectedViewDay || getTodayName();
        }

        function getDayProgress(dayName) {
            if (!savedState.plans[currentPlanKey]) savedState.plans[currentPlanKey] = emptyPlanProgress();
            const plan = savedState.plans[currentPlanKey];
            if (!plan.days) plan.days = emptyPlanProgress().days;
            if (!plan.days[dayName]) plan.days[dayName] = emptyDayProgress();
            return plan.days[dayName];
        }

        function getPlanProgress() {
            return getDayProgress(getViewDayName());
        }

        function getActiveSchedule() {
            if (!appData) return [];
            return appData[currentPlanKey] || appData.schedule || [];
        }

        function applyPlanSelection(planKey) {
            if (!WORKOUT_PLANS[planKey] || !appData || !appData[planKey]) return;
            currentPlanKey = planKey;
            savedState.activePlan = planKey;
            localStorage.setItem('fitforge_plan', planKey);
            localStorage.setItem('fitforge_state', JSON.stringify(savedState));
            $('#currentPlanLabel').text(WORKOUT_PLANS[planKey].label);
            $('.plan-select').removeClass('active');
            $(`.plan-select[data-plan-key="${planKey}"]`).addClass('active');
            renderTodayWorkout();
            renderWeeklyOverview();
        }

        function initDeviceToggle() {
            const device = localStorage.getItem('fitforge_device') || 'ios';
            const $input = $(`input[name="deviceToggle"][value="${device}"]`);
            if ($input.length) $input.prop('checked', true);
            else $('#btnIphone').prop('checked', true);
        }

        function updateFooterVisibility() {
            const $footer = $('footer');
            if (!$footer.length) return;
            const docHeight = document.documentElement.scrollHeight;
            const viewHeight = window.innerHeight;
            const scrollY = window.scrollY;
            const nearBottom = scrollY + viewHeight >= docHeight - 72;
            const fitsViewport = docHeight <= viewHeight + 16;
            $footer.toggleClass('is-visible', nearBottom || fitsViewport);
        }

        function closeHeaderMenu() {
            const $header = $('#dashboardHeader');
            $header.removeClass('menu-open');
            $('#headerMenuBtn').attr('aria-expanded', 'false');
            $('#headerMenuIcon').removeClass('fa-xmark').addClass('fa-bars');
        }

        function toggleHeaderMenu() {
            const $header = $('#dashboardHeader');
            const open = !$header.hasClass('menu-open');
            $header.toggleClass('menu-open', open);
            $('#headerMenuBtn').attr('aria-expanded', open ? 'true' : 'false');
            $('#headerMenuIcon').toggleClass('fa-bars', !open).toggleClass('fa-xmark', open);
        }

        $(document).ready(function () {
            initDeviceToggle();
            $('#currentPlanLabel').text(WORKOUT_PLANS[currentPlanKey].label);
            $('.plan-select').removeClass('active');
            $(`.plan-select[data-plan-key="${currentPlanKey}"]`).addClass('active');

            if (savedState.voiceEnabled) { $('#voiceToggle').addClass('active').find('i').removeClass('fa-volume-xmark').addClass('fa-volume-high'); }
            fetch('data.json').then(res => res.json()).then(data => { appData = data; initApp(); }).catch(err => { $('#workoutContent').html(`<div class="alert alert-danger" style="border-radius:0;">Server/Vercel required to fetch data.json</div>`); });
            $('input[name="deviceToggle"]').on('change', function () {
                localStorage.setItem('fitforge_device', this.value);
                if ($('#audioModal').hasClass('show') && appData) renderAudioList(currentAudioFilter);
            });

            $('.plan-select').on('click', function (e) {
                e.preventDefault();
                applyPlanSelection($(this).data('plan-key'));
            });

            buildDayPicker();
            $(document).on('click', '.day-chip', function () {
                selectedViewDay = $(this).data('day');
                updateDayPickerUI();
                updateDayHeader();
                renderTodayWorkout();
            });

            $(window).on('scroll resize', updateFooterVisibility);
            updateFooterVisibility();

            $('#headerMenuBtn').on('click', toggleHeaderMenu);
            $(document).on('click', '[data-bs-target="#weeklyModal"]', closeHeaderMenu);
            $('.theme-select').on('click', closeHeaderMenu);
            $(window).on('resize', function () {
                if (window.innerWidth > 620) closeHeaderMenu();
            });
            $(document).on('click', function (e) {
                const $header = $('#dashboardHeader');
                if (!$header.hasClass('menu-open')) return;
                if ($(e.target).closest('#dashboardHeader').length) return;
                closeHeaderMenu();
            });

            $(document).on('click', '.set-bubble', function () {
                let exId = $(this).data('ex'); let setIdx = $(this).data('set'); let restTime = $(this).data('rest');
                let $card = $(this).closest('.workout-card');

                const planProgress = getPlanProgress();
                if ($(this).hasClass('active')) {
                    $(this).removeClass('active');
                    planProgress.checkedSets[exId] = planProgress.checkedSets[exId].filter(s => s !== setIdx);
                } else {
                    $(this).addClass('active');
                    planProgress.checkedSets[exId].push(setIdx);
                    startRestTimer(restTime);
                }

                if (planProgress.checkedSets[exId].length === $card.find('.set-bubble').length) { $card.addClass('completed-card'); } else { $card.removeClass('completed-card'); }
                calculateProgress(true);
            });

            $(document).on('change', '#finisherToggle', function () {
                getPlanProgress().finisherDone = this.checked;
                if (this.checked) { $('#card-finisher').addClass('completed-card'); } else { $('#card-finisher').removeClass('completed-card'); }
                calculateProgress(true);
            });
        });

        function toggleVoice() {
            savedState.voiceEnabled = !savedState.voiceEnabled; localStorage.setItem('fitforge_state', JSON.stringify(savedState));
            const $icon = $('#voiceToggle i');
            if (savedState.voiceEnabled) {
                $('#voiceToggle').addClass('active'); $icon.removeClass('fa-volume-xmark').addClass('fa-volume-high');
                let speech = new SpeechSynthesisUtterance(""); window.speechSynthesis.speak(speech);
            } else {
                $('#voiceToggle').removeClass('active'); $icon.removeClass('fa-volume-high').addClass('fa-volume-xmark');
            }
        }

        function buildCardHTML(ex, exId, index, bubblesHtml, isExComplete, isOptional) {
            let optBadge = isOptional ? `<span class="badge bg-secondary opt-badge me-2">OPT</span>` : '';
            return `
                <div class="workout-card animate__animated animate__fadeInUp ${isExComplete ? 'completed-card' : ''}" id="card-${exId}" style="animation-delay: ${index * 0.1}s;">
                    <div class="ex-header"><h3 class="ex-title">${optBadge}${ex.name}</h3><span class="badge bg-dark">${ex.sets}x${ex.reps}</span></div>
                    <div class="set-container">${bubblesHtml}</div>
                    <div class="anatomy-toggle" onclick="$(this).next('.anatomy-content').slideToggle(200);"><i class="fa-solid fa-dna me-2"></i> SCIENCE</div>
                    <div class="anatomy-content">${ex.anatomy_pov}</div>
                    <div class="machine-alt"><i class="fa-solid fa-repeat me-1"></i> ALT: ${ex.machine_alternative}</div>
                </div>
            `;
        }

        function getTodayName() {
            const daysProper = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            return daysProper[new Date().getDay()];
        }

        function formatFinisherBadge(finisher) {
            if (!finisher) return '';
            if (finisher.duration_minutes) return `${finisher.duration_minutes} MIN`;
            if (finisher.sets && finisher.reps) return `${finisher.sets}x${finisher.reps}`;
            if (finisher.reps) return String(finisher.reps);
            return '1 SET';
        }

        function buildDayPicker() {
            const $picker = $('#dayPicker');
            if ($picker.children().length) return;
            WEEK_DAYS.forEach(day => {
                $picker.append(`<button type="button" class="day-chip" data-day="${day}" role="tab" aria-selected="false">${DAY_ABBR[day]}</button>`);
            });
        }

        function updateDayPickerUI() {
            const viewDay = getViewDayName();
            const calendarToday = getTodayName();
            $('.day-chip').each(function () {
                const day = $(this).data('day');
                const isSelected = day === viewDay;
                $(this).toggleClass('is-selected', isSelected).toggleClass('is-calendar-today', day === calendarToday);
                $(this).attr('aria-selected', isSelected ? 'true' : 'false');
            });
        }

        function updateDayHeader() {
            const viewDay = getViewDayName();
            const calendarToday = getTodayName();
            $('#currentDay').text(viewDay);
            if (viewDay !== calendarToday) {
                $('#dayViewHint').text(`Catch-up mode · calendar today is ${calendarToday}`).show();
            } else {
                $('#dayViewHint').hide();
            }
        }

        function renderTodayWorkout() {
            const viewDayName = getViewDayName();
            const calendarToday = getTodayName();
            const schedule = getActiveSchedule();
            const todaysPlan = schedule.find(day => day.day_of_week === viewDayName);
            const planProgress = getPlanProgress();
            const $content = $('#workoutContent').empty();

            if (!todaysPlan) {
                $('#focusArea').text('NO SESSION');
                $('#progressContainer').hide();
                $content.append(`<div class="workout-card text-center py-5"><p class="text-muted mb-0">No workout found for ${viewDayName} in this plan.</p></div>`);
                return;
            }

            $('#focusArea').text(todaysPlan.focus);

            if (todaysPlan.is_rest_day) {
                $('#progressContainer').hide();
                let catchUpHint = calendarToday === viewDayName
                    ? `<p class="px-3 mt-3 mb-0 text-muted" style="line-height:1.6; font-size:0.85rem;">Use the day picker above to run a missed session.</p>`
                    : '';
                $content.append(`<div class="workout-card text-center py-5 animate__animated animate__zoomIn"><i class="fa-solid fa-battery-half fa-3x mb-4 text-muted"></i><h3 class="brand-font mb-3">RECOVERY</h3><p class="px-3 mb-0 text-muted" style="line-height:1.6;">${todaysPlan.notes || 'Rest and recover.'}</p>${catchUpHint}</div>`);
                return;
            }

            if (viewDayName !== calendarToday) {
                $content.append(`<p class="catchup-banner animate__animated animate__fadeIn"><i class="fa-solid fa-clock-rotate-left me-2"></i>${viewDayName} catch-up session</p>`);
            }

            $('#progressContainer').show();
            totalTasks = 0;

            todaysPlan.exercises.forEach((ex, index) => {
                let exId = `ex${index}`;
                if (!planProgress.checkedSets[exId]) planProgress.checkedSets[exId] = [];
                let isExComplete = planProgress.checkedSets[exId].length === ex.sets;

                let bubblesHtml = '';
                for (let s = 0; s < ex.sets; s++) {
                    totalTasks++;
                    let isActive = planProgress.checkedSets[exId].includes(s) ? 'active' : '';
                    bubblesHtml += `<div class="set-bubble ${isActive}" data-ex="${exId}" data-set="${s}" data-rest="${ex.rest_seconds || 60}">${s + 1}</div>`;
                }
                $content.append(buildCardHTML(ex, exId, index, bubblesHtml, isExComplete, false));
            });

            if (todaysPlan.optional_exercises && todaysPlan.optional_exercises.length > 0) {
                $content.append(`
                        <div class="text-center mt-4 mb-4 animate__animated animate__fadeInUp" style="animation-delay: 0.3s;">
                            <button class="btn-action mx-auto" style="border-radius: 20px; padding: 8px 20px; font-weight:600;" type="button" data-bs-toggle="collapse" data-bs-target="#optionalWorkouts">
                                OPTIONAL VOLUME <i class="fa-solid fa-chevron-down ms-2"></i>
                            </button>
                        </div>
                        <div class="collapse" id="optionalWorkouts"></div>
                    `);

                const $optionalContainer = $('#optionalWorkouts');
                todaysPlan.optional_exercises.forEach((ex, index) => {
                    let exId = `opt${index}`;
                    if (!planProgress.checkedSets[exId]) planProgress.checkedSets[exId] = [];
                    let isExComplete = planProgress.checkedSets[exId].length === ex.sets;

                    let bubblesHtml = '';
                    for (let s = 0; s < ex.sets; s++) {
                        let isActive = planProgress.checkedSets[exId].includes(s) ? 'active' : '';
                        bubblesHtml += `<div class="set-bubble ${isActive}" data-ex="${exId}" data-set="${s}" data-rest="${ex.rest_seconds || 60}">${s + 1}</div>`;
                    }
                    $optionalContainer.append(buildCardHTML(ex, exId, index, bubblesHtml, isExComplete, true));
                });
            }

            if (todaysPlan.finisher) {
                totalTasks++;
                let isChecked = planProgress.finisherDone ? 'checked' : '';
                const finisherAlt = todaysPlan.finisher.machine_alternative
                    ? `<div class="machine-alt mt-4"><i class="fa-solid fa-repeat me-1"></i> ALT: ${todaysPlan.finisher.machine_alternative}</div>`
                    : '';
                const finisherScience = todaysPlan.finisher.anatomy_pov
                    ? `<div class="anatomy-toggle mt-3" onclick="$(this).next('.anatomy-content').slideToggle(200);"><i class="fa-solid fa-dna me-2"></i> SCIENCE</div><div class="anatomy-content">${todaysPlan.finisher.anatomy_pov}</div>`
                    : '';
                $content.append(`
                        <div class="workout-card animate__animated animate__fadeInUp ${planProgress.finisherDone ? 'completed-card' : ''} mt-4" id="card-finisher" style="animation-delay: 0.5s;">
                            <h6 class="text-uppercase mb-4" style="font-size: 0.9rem; letter-spacing: 1px; font-weight: 700;"><i class="fa-solid fa-fire me-2"></i> BURNOUT FINISHER</h6>
                            <label class="finisher-label"><input type="checkbox" class="finisher-checkbox" id="finisherToggle" ${isChecked}><span class="flex-grow-1">${todaysPlan.finisher.name}</span><span class="badge bg-dark">${formatFinisherBadge(todaysPlan.finisher)}</span></label>
                            ${finisherScience}
                            ${finisherAlt}
                        </div>
                    `);
            }

            calculateProgress(false);
            requestAnimationFrame(updateFooterVisibility);
        }

        function renderWeeklyOverview() {
            const todayName = getTodayName();
            const schedule = getActiveSchedule();
            const $weekly = $('#weeklyContent').empty();
            const planLabel = WORKOUT_PLANS[currentPlanKey].label;

            $weekly.append(`<p class="text-muted mb-4" style="font-size:0.8rem; font-weight:700; letter-spacing:1px; text-transform:uppercase;"><i class="fa-solid fa-layer-group me-2"></i>${planLabel}</p>`);

            schedule.forEach(day => {
                let isToday = day.day_of_week === todayName ? '<span class="badge bg-dark ms-2" style="font-size:0.6rem;">TODAY</span>' : '';
                let dayHtml = `<div class="mb-4 pb-3" style="border-bottom: var(--border-card);"><strong class="d-block mb-2" style="font-size:1.1rem; text-transform:uppercase;">${day.day_of_week} ${isToday}<br><span style="color: var(--text-muted); font-size: 0.85rem; font-weight:600;">${day.focus}</span></strong>`;
                if (day.is_rest_day) {
                    dayHtml += `<span style="font-size: 0.85rem; font-family: var(--font-secondary);">${day.notes || 'Active Recovery'}</span>`;
                } else if (day.exercises && day.exercises.length) {
                    let optText = day.optional_exercises && day.optional_exercises.length ? ` <span style="color:var(--text-muted);">(+${day.optional_exercises.length} OPT)</span>` : '';
                    dayHtml += `<span style="font-size: 0.85rem; font-family: var(--font-secondary);">${day.exercises.map(ex => ex.name).join(', ')}${optText}</span>`;
                }
                $weekly.append(dayHtml + `</div>`);
            });
        }

        function initApp() {
            selectedViewDay = getTodayName();
            buildDayPicker();
            updateDayPickerUI();
            updateDayHeader();
            renderTodayWorkout();
            renderWeeklyOverview();
        }

        function calculateProgress(triggerAnimation) {
            const planProgress = getPlanProgress();
            let completedSetsCount = 0;
            for (const exId in planProgress.checkedSets) { completedSetsCount += planProgress.checkedSets[exId].length; }
            if (planProgress.finisherDone) completedSetsCount++;
            let percentage = totalTasks === 0 ? 0 : Math.min(100, Math.round((completedSetsCount / totalTasks) * 100));

            $('#workoutProgress').css('width', percentage + '%');

            if (percentage === 100) {
                if (triggerAnimation && !planProgress.hasCelebrated) { triggerConfetti(); planProgress.hasCelebrated = true; }
                $('#progressText').text("COMPLETE");
                $('.progress-wrapper').addClass('is-complete');
            } else {
                planProgress.hasCelebrated = false;
                $('#progressText').text(percentage + '%');
                $('.progress-wrapper').removeClass('is-complete');
            }
            localStorage.setItem('fitforge_state', JSON.stringify(savedState));
        }

        function startRestTimer(seconds) {
            clearInterval(timerInterval);
            const $timer = $('#floatingTimer'); const $display = $('#timerDisplay');
            $timer.removeClass('done').addClass('show');
            let timeLeft = seconds;

            let initM = Math.floor(timeLeft / 60).toString().padStart(2, '0'); let initS = (timeLeft % 60).toString().padStart(2, '0');
            $display.text(`${initM}:${initS}`);

            timerInterval = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft / 60).toString().padStart(2, '0'); let s = (timeLeft % 60).toString().padStart(2, '0');
                $display.text(`${m}:${s}`);

                if (timeLeft <= 0) {
                    clearInterval(timerInterval); $timer.addClass('done'); $display.text("LIFT");
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                    if (savedState.voiceEnabled && 'speechSynthesis' in window) {
                        let speech = new SpeechSynthesisUtterance("Rest over.");
                        speech.volume = 1; speech.rate = 1.1; speech.pitch = 1; window.speechSynthesis.speak(speech);
                    }
                    setTimeout(() => $timer.removeClass('show'), 5000);
                }
            }, 1000);
        }

        function dismissTimer() { $('#floatingTimer').removeClass('show'); clearInterval(timerInterval); }

        function triggerConfetti() {
            let cColors = ['#00ff88', '#ffffff', '#eab308'];
            if (currentTheme === 'brutal') cColors = ['#000000', '#00e676', '#ffd600', '#ff5252', '#448aff'];
            if (currentTheme === 'minimal') cColors = ['#000000', '#ffffff', '#888888'];

            var duration = 3000; var animationEnd = Date.now() + duration; var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999, colors: cColors };
            function randomInRange(min, max) { return Math.random() * (max - min) + min; }
            var interval = setInterval(function () { var timeLeft = animationEnd - Date.now(); if (timeLeft <= 0) return clearInterval(interval); var particleCount = 50 * (timeLeft / duration); confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } })); confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } })); }, 250);
        }

        function createDeepLink(webUrl, device) { if (device === 'web') return webUrl; try { const urlObj = new URL(webUrl); const pathParts = urlObj.pathname.split('/').filter(p => p); if (pathParts.length >= 2) { const type = pathParts[0]; const id = pathParts[1]; if (device === 'ios') return `spotify:${type}:${id}`; if (device === 'android') return `intent://${type}/${id}#Intent;scheme=spotify;package=com.spotify.music;end;`; } } catch (e) { console.error(e); } return webUrl; }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function getSpotifyCatalog() {
            if (!appData || !appData.audio) return [];
            const items = (appData.audio.playlists || []).map(item => ({
                name: item.name,
                url: item.url,
                description: item.description || '',
                type: (item.type || 'playlist').toLowerCase()
            }));
            (appData.audio.podcasts || []).forEach(item => {
                const exists = items.some(i => i.url === item.url || i.name === item.name);
                if (!exists) {
                    items.push({
                        name: item.name,
                        url: item.url,
                        description: item.description || '',
                        type: 'podcast'
                    });
                }
            });
            return items;
        }

        function openAudioModal(filter) {
            currentAudioFilter = filter || 'all';
            renderAudioList(currentAudioFilter);
            bootstrap.Modal.getOrCreateInstance(document.getElementById('audioModal')).show();
        }

        function renderAudioList(filter) {
            const $list = $('#audioModalList').empty();
            const device = $('input[name="deviceToggle"]:checked').val() || 'ios';
            const catalog = getSpotifyCatalog();
            const categories = [
                { key: 'playlist', label: 'Playlists', icon: 'fa-music' },
                { key: 'podcast', label: 'Podcasts', icon: 'fa-microphone-lines' }
            ];

            let hasAny = false;
            categories.forEach(cat => {
                if (filter !== 'all' && filter !== cat.key) return;
                const catItems = catalog.filter(i => i.type === cat.key);
                if (!catItems.length) return;
                hasAny = true;
                $list.append(`<div class="audio-category-label"><i class="fa-solid ${cat.icon}"></i> ${cat.label}</div>`);
                catItems.forEach(item => {
                    const desc = item.description
                        ? `<div class="audio-item-desc">${escapeHtml(item.description)}</div>`
                        : '';
                    $list.append(`
                        <a href="${createDeepLink(item.url, device)}" class="audio-list-item" target="_blank" rel="noopener noreferrer">
                            <i class="fa-solid ${cat.icon} text-muted mt-1"></i>
                            <div class="audio-item-body">
                                <div class="audio-item-title">${escapeHtml(item.name)}</div>
                                ${desc}
                            </div>
                            <i class="fa-solid fa-arrow-up-right-from-square text-muted" style="font-size: 0.8rem; margin-top: 4px;"></i>
                        </a>
                    `);
                });
            });

            if (!hasAny) {
                $list.append('<p class="text-muted mb-0" style="font-size:0.9rem;">No Spotify items in data.json yet.</p>');
            }
        }
        function shareApp() { if (navigator.share) navigator.share({ title: 'FitForge Protocol', text: 'Check out my custom daily protocol.', url: window.location.href }).catch(console.error); else alert("Copy this link: " + window.location.href); }
    </script>
</body>
