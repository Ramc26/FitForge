<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d0b12" id="themeColor">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="description" content="FitForge — train with Hanu, your gym coach.">
    <title>FitForge</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="images/forge-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="images/forge-icon-180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <script>
        (function () {
            var theme = localStorage.getItem('fitforge_theme') || 'flat';
            if (theme !== 'minimal') theme = 'flat';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ffa53d"/><stop offset=".5" stop-color="#ff5a4e"/><stop offset="1" stop-color="#e0399b"/>
            </linearGradient>
            <linearGradient id="chartGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#ffa53d"/><stop offset="1" stop-color="#e0399b"/>
            </linearGradient>
            <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ff5a4e" stop-opacity=".35"/><stop offset="1" stop-color="#ff5a4e" stop-opacity="0"/>
            </linearGradient>
        </defs>
    </svg>
    <div class="shell">
        <nav class="tabbar" aria-label="Primary">
            <a class="brand side-brand" href="#home">
                <span class="brand-mark" aria-hidden="true">🔥</span>
                <span>
                    <strong class="brand-name">FITFORGE</strong>
                    <span class="brand-sub">Forge your body</span>
                </span>
            </a>
            <button class="nav-btn is-active" type="button" data-screen="home">
                <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
                <span>Home</span>
            </button>
            <button class="nav-btn" type="button" data-screen="workout">
                <svg viewBox="0 0 24 24"><path d="M6 9v6M18 9v6M3 10v4M21 10v4M6 12h12"/></svg>
                <span>Workout</span>
                                </button>
            <button class="nav-btn" type="button" data-screen="progress">
                <svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="m7 15 4-5 3 3 5-7"/></svg>
                <span>Progress</span>
                            </button>
            <button class="nav-btn" type="button" data-screen="hanu">
                <svg viewBox="0 0 24 24"><path d="M6 17.5C6 14 8.5 12 12 12s6 2 6 5.5V19H6z"/><circle cx="12" cy="8" r="3"/></svg>
                <span>Hanu</span>
                            </button>
            <button class="nav-btn" type="button" data-screen="profile">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 19c1.5-3 3.8-4.5 7-4.5S17.5 16 19 19"/></svg>
                <span>Profile</span>
                            </button>
        </nav>

        <div class="app">
            <header class="topbar">
                <a class="brand" href="#home">
                    <span class="brand-mark" aria-hidden="true">🔥</span>
                    <span>
                        <h1 class="brand-name">FITFORGE</h1>
                        <span class="brand-sub">Forge your body</span>
                    </span>
                </a>
                <button class="icon-btn" type="button" id="spotifyBtn" aria-label="Spotify">♫</button>
        </header>

            <main>
                <section id="screen-home" class="screen is-on"></section>
                <section id="screen-workout" class="screen"></section>
                <section id="screen-progress" class="screen"></section>
                <section id="screen-hanu" class="screen">
                    <div class="chat-head">
                        <div class="row">
                            <img class="hanu-avatar" src="images/fitnesscoach.png" alt="">
                            <div>
                                <h2>Hanu</h2>
                                <p class="online">Knows your logs</p>
                </div>
            </div>
                        <div class="row">
                            <button class="pill" type="button" id="newHanu">＋ New</button>
                            <button class="icon-btn" type="button" id="closeHanu" hidden aria-label="Close Hanu">✕</button>
            </div>
        </div>
                    <div id="hanuContext" class="context-chip" hidden></div>
                    <div id="hanuThread" class="thread"></div>
                    <div class="suggestions" id="hanuSuggestions"></div>
                    <form id="hanuForm" class="chat-form">
                        <input id="hanuInput" autocomplete="off" placeholder="Ask Hanu" aria-label="Message Hanu">
                        <button type="submit" aria-label="Send">↑</button>
                    </form>
                </section>
                <section id="screen-profile" class="screen"></section>
            </main>
            </div>
        </div>

    <div id="backdrop" class="backdrop" hidden></div>
    <button class="float-hanu" type="button" id="floatHanu" hidden aria-label="Ask Hanu">
        <img src="images/fitnesscoach.png" alt="">
    </button>

    <div id="restOverlay" class="overlay" hidden>
        <div class="timer-card">
            <p class="kicker">Rest</p>
            <div class="ring-wrap">
                <svg viewBox="0 0 120 120" aria-hidden="true">
                    <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
                    <circle id="restRing" class="ring" cx="60" cy="60" r="52"></circle>
                </svg>
                <div id="restReadout" class="timer-readout">01:00</div>
        </div>
            <div class="timer-actions">
                <button type="button" data-rest="15">+15s</button>
                <button type="button" data-rest="30">+30s</button>
                <button type="button" data-rest="dismiss">Dismiss</button>
    </div>
        </div>
    </div>

    <div id="spotifyModal" class="modal" hidden>
        <div class="modal-card">
            <div class="chat-head">
                <h2 style="margin:0">Spotify</h2>
                <button class="icon-btn" type="button" id="closeSpotify" aria-label="Close">✕</button>
                </div>
            <div class="pills" id="devicePills" style="margin:12px 0"></div>
            <div id="spotifyList"></div>
        </div>
    </div>

    <div id="toast" class="toast" hidden></div>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
